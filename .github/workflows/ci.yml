# Every push to main and every pull request, on the Claude Code version the plugin is built for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # The system layer run for real, where the mod runs: sips on macOS, ImageMagick on Linux,
  # PowerShell and System.Drawing on Windows.
  system:
    name: System layer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ImageMagick, Tk and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-tk xvfb

      - name: Check the system layer
        if: runner.os != 'Linux'
        run: node --experimental-strip-types scripts/system-check.ts

      - name: Check the system layer, on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node --experimental-strip-types scripts/system-check.ts
